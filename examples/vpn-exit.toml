# bifrost-vpnd — exit mode (egress NAT).
#
# Runs an IPv4 TUN, sets ip_forward=1, installs:
#   iptables -t nat -A POSTROUTING -s <pool> -o <iface> -j MASQUERADE
#   iptables -A FORWARD -i <tun> -o <iface> -j ACCEPT
#   iptables -A FORWARD -o <tun> -i <iface> -m conntrack \
#            --ctstate RELATED,ESTABLISHED -j ACCEPT
#
# Requires CAP_NET_ADMIN at runtime:
#   sudo setcap cap_net_admin+ep ./bifrost-vpnd
# or just run the daemon as root.

mode = "exit"

[exit]
tun_name     = "bifrost-eg0"
pool_base    = "10.55.0.0"
pool_prefix  = 24                # /24 = 253 client leases
egress_iface = "eth0"            # interface that gets MASQUERADE'd

# Persist peer → lease (and last-activity) so clients keep their IP across
# exit restarts. Empty disables persistence.
# lease_persistence_path = "/var/lib/bifrost/leases.json"

# Client admission. ed25519 identities are free to mint and every admitted
# key gets a sticky lease, so an open exit can have its pool filled by
# throwaway keys. List the clients you serve (hex pub keys). Empty = open
# exit (a warning is logged at startup).
allowed_clients = [
  # "<CLIENT-PUBKEY-HEX>",
]
# Per-identity admission cost: minimum norn key difficulty (leading 1-bits
# of BLAKE2b(pub_key) — same measure as norn's Sybil threshold). Each bit
# doubles the work to grind a throwaway key. 0 = disabled.
min_client_pow_bits = 0
# When the pool is full, the least-recently-active lease with no live session
# (and whose peer isn't connected) is reclaimed; live leases never are.

# bifrost-ctl admin socket. The parent dir is created 0700 if missing and
# the socket is chmod 0600. "" disables.
admin_socket = "/run/bifrost/vpnd-exit.sock"

# Destination filtering (SSRF defence). Loopback, link-local (incl. the
# 169.254.169.254 cloud-metadata endpoint), multicast, broadcast and
# unspecified are ALWAYS dropped. With block_private_dst = true (the default)
# RFC1918 (10/8, 172.16/12, 192.168/16), CGNAT 100.64/10 and IPv6 ULA fc00::/7
# are dropped too, so a client can't pivot to the exit's internal network.
block_private_dst = true
# Punch holes for split-tunnel to specific internal subnets (overrides the
# private block; does NOT re-enable the always-blocked set):
# dst_allow = ["192.168.10.0/24"]
# Extra ranges to drop on top of the defaults (dst_allow wins over dst_deny):
# dst_deny = ["203.0.113.0/24"]

[node]
private_key = "REPLACE_ME_WITH_GENCONFIG_OUTPUT"
listen = ["tcp://0.0.0.0:9001"]
peers = []
admin_socket = "/run/bifrost/norn-vpn-exit.sock"
peer_cache_path = "/var/lib/bifrost/vpn-exit-peers.json"
multicast_enabled = false
mdns_enabled = false
log_level = "info"
